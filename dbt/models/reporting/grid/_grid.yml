version: 2

models:
  - name: consumption_by_area_daily
    description: Daily electricity consumption per grid area. No personal data.
    columns:
      - name: region
        data_tests:
          - not_null
          - accepted_values:
              values: ["DK1", "DK2"]
      - name: subregion
        data_tests: [not_null]
      - name: reading_date
        data_tests: [not_null]
